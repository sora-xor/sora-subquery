specVersion: 1.0.0
name: analog-bridge
version: 1.0.0
runner:
  node:
    name: '@subql/node'
    version: 5.6.0
  query:
    name: '@subql/query'
    version: 2.15.2
description: ''
repository: https://github.com/sora-xor/sora-subquery
schema:
  file: ./schema.graphql
network:
  chainId: '0x7a0f5cf23f4cdf391e6adadb4f5193fed975b1b621afbc96a522234c56688adb'
  endpoint: wss://rpc-sora.development.analog.one
  chaintypes:
    file: ./types.json
dataSources:
  - kind: substrate/Runtime
    startBlock: 1
    mapping:
      file: ./dist/index.js
      handlers:
        - handler: soraEthTransferHandler
          kind: substrate/CallHandler
          filter:
            module: ethBridge
            method: transferToSidechain
        - handler: ethSoraTransferEventHandler
          kind: substrate/EventHandler
          filter:
            module: ethBridge
            method: IncomingRequestFinalized
        - handler: ethSoraTransferEventHandler
          kind: substrate/EventHandler
          filter:
            module: ethBridge
            method: IncomingRequestFinalizationFailed
